{% extends "base.html" %}
{% block content %}
<style>
  body, .users-bg {
    background: #f7f8fa !important;
  }
  .users-center-wrapper {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 80vh;
    padding-top: 40px;
    padding-bottom: 40px;
  }
  .users-card {
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 2px 12px rgba(36, 118, 255, 0.06);
    padding: 2.5rem 2.5rem 2.5rem 2.5rem;
    margin-bottom: 2rem;
    width: 700px;
    max-width: 95vw;
    min-width: 340px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .users-header {
    font-size: 2rem;
    font-weight: bold;
    color: #2476ff;
    margin-bottom: 1.5rem;
    text-align: center;
  }
  .btn-primary {
    background: #2476ff !important;
    border: none;
    font-weight: 500;
    border-radius: 8px;
  }
  .btn-danger {
    background: #ff7043 !important;
    border: none;
    border-radius: 8px;
  }
  .table {
    background: #fff;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 2px 12px rgba(36, 118, 255, 0.04);
    margin-bottom: 0;
  }
  .table th {
    color: #2476ff;
    font-weight: 600;
    background: #f7f8fa;
    border-bottom: 2px solid #e5e7eb;
    text-align: center;
  }
  .table td {
    text-align: center;
    vertical-align: middle;
  }
  @media (max-width: 800px) {
    .users-card {
      width: 98vw;
      padding: 1.2rem 0.5rem;
    }
  }
</style>
<div class="users-bg" style="min-height:100vh;">
  <div class="users-center-wrapper">
    <div class="users-card">
      <div class="users-header">Users</div>
      <a href="{{ url_for('add_user') }}" class="btn btn-primary mb-3">Add User</a>
      <div class="table-responsive w-100">
        <table class="table">
          <thead><tr><th>Username</th><th>Action</th></tr></thead>
          <tbody>
            {% for u in users %}
            <tr>
              <td>{{ u.username }}</td>
              <td>
                <form method="post" action="{{ url_for('delete_user', user_id=u.id) }}" style="display:inline;">
                  <button class="btn btn-danger btn-sm">Delete</button>
                </form>
              </td>
            </tr>
            {% endfor %}
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
{% endblock %}
